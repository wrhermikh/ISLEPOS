openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Signed-in user profile and role
  - name: staff
    description: Owner-managed shop access
  - name: products
    description: Product catalog and stock levels
  - name: sales
    description: Point-of-sale checkout and payment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in shop user
      responses:
        "200":
          description: Current user and assigned shop role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: User has not been granted shop access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List shop users and pending cashier access
      responses:
        "200":
          description: Shop staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /staff/invitations:
    post:
      operationId: inviteCashier
      tags: [staff]
      summary: Grant cashier access to a verified email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationInput"
      responses:
        "201":
          description: Cashier access is ready for that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already has shop access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List active shop products with current stock
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Products available to the signed-in shop
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product and optional opening stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/ProductCreateInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: SKU or barcode already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /financial-accounts:
    get:
      operationId: listFinancialAccounts
      tags: [sales]
      summary: List active cash and bank accounts for checkout
      responses:
        "200":
          description: Active accounts in the signed-in shop
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialAccount"
  /customers:
    get:
      operationId: listCustomers
      tags: [sales]
      summary: Search shop customers for credit sales and receipts
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Matching customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [sales]
      summary: Add a customer for credit sales and emailed receipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Invalid customer data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales:
    post:
      operationId: createSale
      tags: [sales]
      summary: Create an invoice, record payments, and decrement stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/SaleCreateInput"
      responses:
        "200":
          description: Idempotent retry of a previously committed sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleReceipt"
        "201":
          description: Sale committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleReceipt"
        "400":
          description: Invalid sale or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role does not permit this sale operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key was reused with different sale data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, cashier]
        status:
          type: string
          enum: [active, pending]
      required: [id, email, fullName, role, status]
    StaffMember:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, cashier]
        status:
          type: string
          enum: [active, pending]
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, status, createdAt]
    StaffInvitationInput:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: ["string", "null"]
        name:
          type: string
        categoryName:
          type: ["string", "null"]
        unit:
          type: string
        sellingPriceLaari:
          type: string
          pattern: "^[0-9]+$"
        costPriceLaari:
          type: string
          pattern: "^[0-9]+$"
        stockOnHand:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]{1,3})?$"
        lowStockThreshold:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,3})?$"
        isActive:
          type: boolean
      required:
        - id
        - sku
        - barcode
        - name
        - categoryName
        - unit
        - sellingPriceLaari
        - costPriceLaari
        - stockOnHand
        - lowStockThreshold
        - isActive
    ProductCreateInput:
      type: object
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 80
        barcode:
          type: string
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 160
        categoryName:
          type: string
          maxLength: 80
        unit:
          type: string
          minLength: 1
          maxLength: 40
        sellingPriceLaari:
          type: string
          pattern: "^[0-9]+$"
        costPriceLaari:
          type: string
          pattern: "^[0-9]+$"
        lowStockThreshold:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,3})?$"
        openingQuantity:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,3})?$"
        openingReason:
          type: string
          minLength: 1
          maxLength: 240
      required:
        - sku
        - name
        - sellingPriceLaari
        - costPriceLaari
        - lowStockThreshold
        - openingQuantity
        - openingReason
    FinancialAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        accountType:
          type: string
          enum: [cash, bank]
      required: [id, name, accountType]
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
      required: [id, fullName, phone, email]
    CustomerCreateInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 160
        phone:
          type: string
          maxLength: 40
        email:
          type: string
          format: email
          maxLength: 254
      required: [fullName]
    SaleItemInput:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,3})?$"
      required: [productId, quantity]
    SalePaymentInput:
      type: object
      properties:
        amountLaari:
          type: string
          pattern: "^[0-9]+$"
        accountId:
          type: string
          format: uuid
        method:
          type: string
          enum: [cash, bank_transfer, card, other]
        reference:
          type: string
          maxLength: 120
      required: [amountLaari, accountId, method]
    SaleCreateInput:
      type: object
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SaleItemInput"
        customerId:
          type: string
          format: uuid
        discountLaari:
          type: string
          pattern: "^[0-9]+$"
        discountReason:
          type: string
          maxLength: 240
        payments:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/SalePaymentInput"
      required: [idempotencyKey, items]
    SaleReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        status:
          type: string
          enum: [issued, partially_paid, paid]
        subtotalLaari:
          type: string
        discountLaari:
          type: string
        totalLaari:
          type: string
        paidLaari:
          type: string
        balanceDueLaari:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - invoiceNumber
        - status
        - subtotalLaari
        - discountLaari
        - totalLaari
        - paidLaari
        - balanceDueLaari
        - createdAt

